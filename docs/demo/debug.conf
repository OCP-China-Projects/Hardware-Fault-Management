# Debug logging overlay for the serial_bridge sample.
# Layered on top of prj.conf via: west build ... -- -DEXTRA_CONF_FILE=debug.conf
# Goal: show the full boot / init / MCTP / PLDM sequence at DEBUG verbosity.

# Immediate (synchronous) logging so early-boot lines are not buffered/lost and
# ordering matches execution. Costs latency but that is fine for a demo.
CONFIG_LOG_MODE_IMMEDIATE=y

# Global default log level = DEBUG (4) for every module that does not pin its own.
CONFIG_LOG_DEFAULT_LEVEL=4

# Our stack: crank MCTP + PLDM to DEBUG.
CONFIG_MCTP_LOG_LEVEL_DBG=y
CONFIG_PLDM_LOG_LEVEL_DBG=y

# Show the kernel boot banner and device init order.
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y

# Print each device's initialisation as the kernel brings the driver model up
# (this is the closest Zephyr has to a Linux-style boot log).
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_TIMESTAMP_64BIT=y

# Larger log buffer for the extra verbosity.
CONFIG_LOG_BUFFER_SIZE=16384
